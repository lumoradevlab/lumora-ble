group = "dev.lumora.ble.flutter"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories { google(); mavenCentral() }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories { google(); mavenCentral() }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "dev.lumora.ble.flutter"
    compileSdk = 35

    defaultConfig { minSdk = 26 }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    // These are the coordinates the SDK will publish under. Until it is on
    // Maven, the host app's settings.gradle substitutes them for the local
    // Gradle modules via includeBuild — see example/android/settings.gradle.kts.
    // Substitution rather than a project(":sdk") path keeps this file correct
    // for consumers who resolve the published artifact.
    // The Flutter distribution bundles every protocol: a Dart consumer cannot
    // express a per-protocol Gradle dependency the way a native one can.
    implementation "dev.lumora.ble:sdk:0.1.0-alpha01"
    implementation "dev.lumora.ble:standard:0.1.0-alpha01"
    implementation "dev.lumora.ble:oura:0.1.0-alpha01"
    implementation "dev.lumora.ble:libre:0.1.0-alpha01"
    implementation "dev.lumora.ble:dexcom:0.1.0-alpha01"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
