group = "dev.lumora.ble.flutter"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories { google(); mavenCentral() }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories { google(); mavenCentral() }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "dev.lumora.ble.flutter"
    compileSdk = 35

    defaultConfig { minSdk = 26 }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    // Resolved from a Maven repository like any other dependency. The plugin
    // deliberately does NOT use a composite build: includeBuild would drag the
    // SDK's own Gradle build into the consumer's, and Gradle forbids two
    // Android Gradle Plugin versions in one build — pinning every integrating
    // app to this repository's AGP and Kotlin versions. Publishing real
    // artifacts is what keeps the consumer free to choose their own.
    //
    // The Flutter distribution bundles every protocol: a Dart consumer cannot
    // express a per-protocol Gradle dependency the way a native one can, so
    // the vendor terms-of-service warning applies to any Flutter integration.
    implementation "dev.lumora.ble:sdk:0.1.0-alpha01"
    implementation "dev.lumora.ble:standard:0.1.0-alpha01"
    implementation "dev.lumora.ble:oura:0.1.0-alpha01"
    implementation "dev.lumora.ble:libre:0.1.0-alpha01"
    implementation "dev.lumora.ble:dexcom:0.1.0-alpha01"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
