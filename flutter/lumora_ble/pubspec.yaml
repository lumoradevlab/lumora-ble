name: lumora_ble
description: >-
  One API for health wearables. Android reads Oura, Dexcom G6, FreeStyle Libre
  and standard BLE heart rate; iOS reads Apple Watch data from HealthKit. The
  platforms support different devices — check supportedDevices() at runtime.
version: 0.1.0-alpha.1
repository: https://github.com/lumoradevlab/BLE-Android
issue_tracker: https://github.com/lumoradevlab/BLE-Android/issues
topics:
  - bluetooth
  - healthkit
  - wearables
  - ble

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.lumora.ble.flutter
        pluginClass: LumoraBlePlugin
      ios:
        pluginClass: LumoraBlePlugin
        sharedDarwinSource: false
